server_url = "wss://console.example.invalid/api/robots/connect"
credential_env = "RPA_ROBOT_CREDENTIAL"
# Public HTTPS certificates (including ngrok) use the system CA store.
# ca_file = "../../private/console-ca.pem"
journal = "executor.sqlite"

[deployments.inventory]
app_id = "jushuitan.inventory.export_stock"
version = "0.5.0"
package = "inventory-jushuitan-export-stock"
module = "inventory_jushuitan_export_stock.program"
# Paths resolve from this configuration file, not the shell working directory.
python = "../../apps/inventory_jushuitan_export_stock/.venv/Scripts/python.exe"
cwd = "../../apps/inventory_jushuitan_export_stock"
allowed_hosts = ["www.erp321.com", "erp321.com"]

[deployments.report]
app_id = "jingmai.reports.export_product_detail"
version = "0.2.0"
package = "report-jingmai-export-product-detail"
module = "report_jingmai_export_product_detail.program"
python = "../../apps/report_jingmai_export_product_detail/.venv/Scripts/python.exe"
cwd = "../../apps/report_jingmai_export_product_detail"
allowed_hosts = ["shop.jd.com", "passport.shop.jd.com", "passport.jd.com", "jdsz.jd.com"]
