[project]
name = "rpa-core"
version = "0.8.0"
description = "Shared browser actions, sequential runs and outcome checks for independent RPA applications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "DrissionPage==4.1.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.uv]
package = true
