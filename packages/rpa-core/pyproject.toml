[project]
name = "rpa-core"
version = "0.2.0"
description = "Core contracts, validation gates, runtime, checkpoints, and safe write policies for independent RPA applications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "DrissionPage==4.1.1.4",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.uv]
package = true
